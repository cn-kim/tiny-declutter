<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny declutter — today's suggestion</title>
<meta name="description" content="A fresh, tiny decluttering suggestion each day. No pressure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:Nunito,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:oklch(0.55 0.07 198);text-decoration:none;border-bottom:1px solid oklch(0.82 0.04 198)}
  a:hover{color:oklch(0.46 0.08 198)}

  @keyframes cardIn{0%{opacity:0;transform:translateY(16px) scale(.97)}100%{opacity:1;transform:none}}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    background:linear-gradient(180deg,#f7fbfb 0%,#e7f1f1 100%);
    position:relative;
    overflow:hidden;
  }
  .blob{position:absolute;border-radius:50%;pointer-events:none}
  .blob-a{width:520px;height:520px;top:-160px;right:-120px;
    background:radial-gradient(circle at 50% 50%, rgba(150,205,205,.4), rgba(150,205,205,0) 70%)}
  .blob-b{width:420px;height:420px;bottom:-160px;left:-120px;
    background:radial-gradient(circle at 50% 50%, rgba(165,205,220,.32), rgba(165,205,220,0) 70%)}

  .inner{position:relative;z-index:2;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}

  .wordmark{font-family:Quicksand;font-weight:700;font-size:16px;letter-spacing:.02em;color:#4f7a7a;animation:fadeUp .5s ease both}
  .kicker{font-family:Nunito;font-weight:600;font-size:14px;color:#7aa3a3;margin-top:6px;text-align:center;animation:fadeUp .5s .05s ease both}

  .card-wrap{width:100%;margin-top:28px}
  .card{
    background:#fff;
    border-radius:24px;
    padding:36px 32px 34px;
    box-shadow:0 26px 52px -24px rgba(45,95,95,.42),0 2px 6px rgba(45,95,95,.06);
    text-align:left;
    animation:cardIn .55s ease both;
  }
  .card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:Nunito}
  .visit{font-weight:200;font-size:14px;color:#4f7a7a;letter-spacing:.01em;font-style:italic;opacity:.8}
  .date{font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a6c4c4;white-space:nowrap}
  .rule{height:1px;background:#e5eeee;margin:16px 0 26px}
  .emoji{font-size:50px;line-height:1;text-align:center}
  .title{font-family:Quicksand;font-weight:700;font-size:29px;color:#294a4a;line-height:1.22;margin-top:20px;text-align:center}
  .desc{font-family:Nunito;font-size:16px;color:#6b8a8a;line-height:1.55;margin-top:13px;text-align:center}

  .pill{
    margin-top:26px;display:flex;align-items:center;gap:9px;
    background:#fff;border-radius:999px;padding:10px 18px;
    box-shadow:0 10px 24px -14px rgba(45,95,95,.4);
    animation:fadeUp .5s .12s ease both;
  }
  .pill-icon{font-size:15px}
  .pill-text{font-family:Nunito;font-weight:700;font-size:14px;color:#4f7a7a}

  .footnote{margin-top:18px;max-width:340px;text-align:center;font-family:Nunito;font-size:13.5px;line-height:1.55;color:#8fadad;animation:fadeUp .5s .18s ease both}
</style>
</head>
<body>
<main class="stage">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>

  <div class="inner">
    <div class="wordmark">tiny declutter</div>
    <div class="kicker">Today's suggestion</div>

    <div class="card-wrap">
      <div class="card">
        <div class="card-head">
          <span class="visit" id="visit"></span>
          <span class="date" id="date"></span>
        </div>
        <div class="rule"></div>
        <div class="emoji" id="emoji"></div>
        <div class="title" id="title"></div>
        <div class="desc" id="desc"></div>
      </div>
    </div>

    <div class="pill">
      <span class="pill-icon">🗓️</span>
      <span class="pill-text">A fresh suggestion each day</span>
    </div>

    <div class="footnote">No pressure. Come back whenever you like.</div>
  </div>
</main>

<!-- The daily suggestions live in their own file — edit missions.js to add or remove them. -->
<script src="missions.js"></script>

<script>
  // Friendly greeting per category. Any category not listed here still works —
  // the card falls back to "Let's visit the <category> today".
  var VISIT = {
    Bathroom: "Let's visit the bathroom today",
    Kitchen: "Let's visit the kitchen today",
    Closet: "Let's visit the closet today",
    Paper: "Let's sort some paper today",
    Digital: "Let's tidy your phone today",
  };

  // Same calendar date -> same integer everywhere, so everyone shares the day's mission.
  function dayNumber(d) {
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  function render() {
    // Safety net: if missions.js is missing or the list is empty, show a gentle note
    // instead of a broken page.
    if (typeof MISSIONS === 'undefined' || !MISSIONS.length) {
      document.getElementById('title').textContent = 'No suggestions yet';
      document.getElementById('desc').textContent = 'Add some missions in missions.js to get started.';
      return;
    }

    var d = new Date();
    var L = MISSIONS.length;
    var idx = ((dayNumber(d) % L) + L) % L;
    var mission = MISSIONS[idx];
    var visit = VISIT[mission.category] || "Let's visit the " + mission.category.toLowerCase() + " today";
    var dateLabel = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

    document.getElementById('visit').textContent = visit;
    document.getElementById('date').textContent = dateLabel;
    document.getElementById('emoji').textContent = mission.emoji;
    document.getElementById('title').textContent = mission.title;
    document.getElementById('desc').textContent = mission.desc;
  }

  render();
  // Re-render each minute so the mission flips over at midnight without a reload.
  setInterval(render, 60000);
</script>
</body>
</html>
